<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP Video Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;600&display=swap');
        body { font-family: 'Anuphan', sans-serif; transition: 0.3s; }
        body.dark { background: #0f172a; color: #f1f5f9; }
        body.light { background: #f8fafc; color: #1e293b; }
        .glass-card { backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        .dark .glass-card { background: rgba(30, 41, 59, 0.7); }
        .light .glass-card { background: white; border-color: #e2e8f0; }
        #videoModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
    </style>
</head>
<body class="dark p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header Section -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold italic tracking-tighter text-sky-500">SOP SYSTEM DASHBOARD</h1>
                <p class="text-slate-400 text-sm">ระบบสรุปผลและตรวจสอบการบันทึกวิดีโอรายวัน</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleMode()" id="modeBtn" class="bg-amber-500 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-lg transition hover:scale-105">☀️ โหมดสว่าง</button>
                <button onclick="exportPDF()" class="bg-rose-600 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-lg transition hover:scale-105">📄 โหลดรายงาน PDF</button>
            </div>
        </header>

        <!-- Filter & Stats Section -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <!-- Search Filter -->
            <div class="glass-card p-6 flex flex-col justify-center">
                <label class="text-[10px] uppercase font-bold text-slate-500 mb-2">ค้นหารหัส ปณ. / วันที่</label>
                <input type="text" id="searchBranch" onkeyup="filterTable()" placeholder="รหัส ปณ. 5 หลัก..." class="bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-sky-500 mb-2">
                <input type="date" id="searchDate" onchange="filterTable()" class="bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>

            <!-- % Success Chart -->
            <div class="glass-card p-4 flex flex-col items-center">
                <p class="text-[10px] font-bold text-slate-500 uppercase mb-2">อัตราความสำเร็จวันนี้</p>
                <div class="relative w-24 h-24">
                    <canvas id="percentChart"></canvas>
                    <div id="percentText" class="absolute inset-0 flex items-center justify-center font-bold text-lg">0%</div>
                </div>
            </div>

            <!-- Daily Activity Chart[cite: 1] -->
            <div class="glass-card p-4 md:col-span-2">
                <canvas id="dailyChart" height="100"></canvas>
            </div>
        </div>

        <!-- Summary Status Table[cite: 1] -->
        <div class="glass-card overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-white/5 flex justify-between items-center">
                <h3 class="font-bold">📋 สรุปสถานะรายสาขา (3 งานหลัก)[cite: 1]</h3>
                <span class="text-[10px] text-slate-500 italic">* อัปเดตล่าสุดอัตโนมัติ</span>
            </div>
            <div class="overflow-x-auto">
                <table id="mainTable" class="w-full text-left border-collapse">
                    <thead class="bg-slate-500/5 text-[11px] uppercase font-bold text-slate-400">
                        <tr>
                            <th class="py-4 px-6">รหัส ปณ.[cite: 1]</th>
                            <th class="py-4 px-6 text-center">เปิดเซฟ[cite: 1]</th>
                            <th class="py-4 px-6 text-center">นับเงิน[cite: 1]</th>
                            <th class="py-4 px-6 text-center">ปิดเซฟ[cite: 1]</th>
                            <th class="py-4 px-6 text-center">สถานะรวม[cite: 1]</th>
                            <th class="py-4 px-6 text-right">แอคชั่น</th>
                        </tr>
                    </thead>
                    <tbody id="summaryBody" class="divide-y divide-slate-500/10 text-sm">
                        <tr><td colspan="6" class="py-20 text-center text-slate-500 italic">กำลังดึงข้อมูลจากระบบ...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Video Preview Modal[cite: 1] -->
    <div id="videoModal" onclick="closeModal()">
        <div id="modalContent" class="bg-slate-900 rounded-3xl overflow-hidden max-w-3xl w-full relative mx-4 border border-white/10 shadow-2xl" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxiaCaMsu1glS9FxbvpzxfZMUIenuzGZMY3gJcBTmLdB3hfE2TLt0LeJcTONV4YAFvtSQ/exec";
        let allData = [];
        let charts = {};

        function toggleMode() {
            const body = document.body;
            const btn = document.getElementById('modeBtn');
            if (body.classList.contains('dark')) {
                body.classList.replace('dark', 'light');
                btn.innerText = "🌙 โหมดมืด";
            } else {
                body.classList.replace('light', 'dark');
                btn.innerText = "☀️ โหมดสว่าง";
            }
        }

        async function refreshData() {
            try {
                const res = await fetch(`${API_URL}?action=getList`);
                const data = await res.json();
                if (data.status === "success") {
                    allData = data.rows;
                    processDashboard(data.rows, data.stats);
                }
            } catch (e) {
                console.error("Fetch Error:", e);
            }
        }

        function processDashboard(rows, stats) {
            // 1. ประมวลผลสถานะ 3 งานหลักแยกตาม ปณ.[cite: 1]
            const summary = {};
            rows.forEach(r => {
                const branch = r.branch.toString();
                if (!summary[branch]) summary[branch] = { open: null, count: null, close: null, name: r.name };
                
                if (r.type.includes("เปิดเซฟ")) summary[branch].open = r.videoUrl;
                if (r.type.includes("นับเงิน")) summary[branch].count = r.videoUrl;
                if (r.type.includes("ปิดเซฟ")) summary[branch].close = r.videoUrl;
            });

            // 2. แสดงผลในตาราง[cite: 1]
            const tbody = document.getElementById('summaryBody');
            const branchKeys = Object.keys(summary);
            
            if (branchKeys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="py-10 text-center text-slate-500">ไม่พบข้อมูล</td></tr>';
            } else {
                tbody.innerHTML = branchKeys.map(key => {
                    const s = summary[key];
                    const isComplete = s.open && s.count && s.close;
                    const statusClass = isComplete ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 'bg-rose-500/10 text-rose-500 border-rose-500/20';
                    
                    return `
                        <tr class="hover:bg-slate-500/5 transition">
                            <td class="py-4 px-6 font-bold text-sky-500">${key}</td>
                            <td class="py-4 px-6 text-center">${s.open ? '✅' : '❌'}</td>
                            <td class="py-4 px-6 text-center">${s.count ? '✅' : '❌'}</td>
                            <td class="py-4 px-6 text-center">${s.close ? '✅' : '❌'}</td>
                            <td class="py-4 px-6 text-center">
                                <span class="px-3 py-1 rounded-full text-[10px] font-bold border ${statusClass}">
                                    ${isComplete ? 'ครบ 3 สถานะ' : 'ยังไม่ครบ[cite: 1]'}
                                </span>
                            </td>
                            <td class="py-4 px-6 text-right">
                                <button onclick="alert('สาขานี้: ${s.name}')" class="text-slate-500 hover:text-white transition">ℹ️</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            updateCharts(stats, summary);
        }

        function updateCharts(stats, summary) {
            // กราฟ % ความสำเร็จ[cite: 1]
            const totalBranch = Object.keys(summary).length;
            const completeBranch = Object.values(summary).filter(s => s.open && s.count && s.close).length;
            const percent = totalBranch > 0 ? Math.round((completeBranch / totalBranch) * 100) : 0;
            document.getElementById('percentText').innerText = percent + "%";

            if (charts.percent) charts.percent.destroy();
            charts.percent = new Chart(document.getElementById('percentChart'), {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [percent, 100 - percent],
                        backgroundColor: ['#0ea5e9', '#1e293b'],
                        borderWidth: 0,
                        circumference: 360,
                        rotation: 0
                    }]
                },
                options: { cutout: '85%', plugins: { legend: { display: false } } }
            });

            // กราฟรายวัน (7 วันย้อนหลัง)[cite: 1]
            const labels = Object.keys(stats.byDate).reverse().slice(-7);
            const values = labels.map(l => stats.byDate[l]);

            if (charts.daily) charts.daily.destroy();
            charts.daily = new Chart(document.getElementById('dailyChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'จำนวนคลิป',
                        data: values,
                        backgroundColor: '#0ea5e9',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } }
                    }
                }
            });
        }

        function filterTable() {
            const branchVal = document.getElementById('searchBranch').value.toLowerCase();
            const rows = document.querySelectorAll('#summaryBody tr');
            
            rows.forEach(row => {
                const branchText = row.cells[0].innerText.toLowerCase();
                row.style.display = branchText.includes(branchVal) ? '' : 'none';
            });
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text("SOP Video System - Daily Report", 14, 20);
            doc.setFontSize(10);
            doc.text(`Report Date: ${new Date().toLocaleString()}`, 14, 28);
            
            doc.autoTable({
                html: '#mainTable',
                startY: 35,
                theme: 'grid',
                headStyles: { fillColor: [14, 165, 233] },
                columns: [
                    { header: 'Branch ID', dataKey: 'branch' },
                    { header: 'Open', dataKey: 'open' },
                    { header: 'Count', dataKey: 'count' },
                    { header: 'Close', dataKey: 'close' },
                    { header: 'Status', dataKey: 'status' }
                ]
            });
            doc.save(`SOP_Report_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        function closeModal() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('modalContent').innerHTML = '';
        }

        window.onload = refreshData;
    </script>
</body>
</html>
