<!-- (ส่วน Head, Style, HTML ยังคงเดิมทุกประการ) -->
<script>
let recorder, stream, chunks = [];
let isRecording = false;
const API_URL = "https://script.google.com/macros/s/AKfycbz3KuaPfiiKUs--zHzay55h6qisIFYmJL2M6-fo0fFjgMfeWcompBHgMO0_0XhJrzW4aQ/exec";
const statusEl = document.getElementById('status');
const previewEl = document.getElementById('preview');
const recBadge = document.getElementById('recBadge');
const uploadOverlay = document.getElementById('uploadOverlay');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

document.getElementById('date').valueAsDate = new Date();

async function startCamera() {
  if (isRecording) return;
  if(!document.getElementById('name').value || !document.getElementById('branch').value) {
    alert("กรุณากรอกชื่อและสาขาก่อนเริ่มครับ"); return;
  }
  try {
    statusEl.innerText = "กำลังเข้าถึงกล้อง...";
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: true
    });
    previewEl.srcObject = stream;
    await previewEl.play();
    
    recorder = new MediaRecorder(stream, {
      mimeType: 'video/webm;codecs=vp8',
      videoBitsPerSecond: 1200000
    });
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = handleStop;
    recorder.start();
    isRecording = true;
    
    recBadge.classList.remove('hidden');
    statusEl.innerText = "🔴 กำลังบันทึกวิดีโอ...";
    statusEl.classList.add('text-red-400');
    startBtn.disabled = true; startBtn.classList.add('opacity-50', 'cursor-not-allowed');
    stopBtn.disabled = false; stopBtn.classList.remove('opacity-50', 'cursor-not-allowed');
  } catch (e) {
    console.error(e);
    alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตสิทธิ์การใช้กล้อง");
    statusEl.innerText = "สถานะ: กล้องขัดข้อง";
  }
}

function stopCamera() {
  if (!isRecording) return;
  recorder.stop();
  stream.getTracks().forEach(t => t.stop());
  isRecording = false;
  recBadge.classList.add('hidden');
  uploadOverlay.style.display = 'flex';
  statusEl.innerText = "🔄 กำลังเตรียมไฟล์...";
  statusEl.classList.remove('text-red-400');
  stopBtn.disabled = true; stopBtn.classList.add('opacity-50', 'cursor-not-allowed');
}

function handleStop() {
  const blob = new Blob(chunks, { type: "video/webm" });
  previewEl.srcObject = null;
  previewEl.src = URL.createObjectURL(blob);
  previewEl.controls = true;
  upload(blob);
  chunks = [];
}

async function upload(blob) {
  // 🔧 เพิ่มการตรวจสอบขนาดไฟล์เพื่อป้องกัน GAS Limit (50MB)
  if (blob.size > 30 * 1024 * 1024) {
    alert("ขนาดไฟล์เกิน 30MB ระบบอาจอัปโหลดไม่สำเร็จ กรุณาบันทึกคลิปให้สั้นลง");
    resetUI(); return;
  }

  const reader = new FileReader();
  reader.readAsDataURL(blob);
  reader.onloadend = async () => {
    const base64 = reader.result.split(',')[1];
    const params = new URLSearchParams();
    params.append("name", document.getElementById("name").value);
    params.append("branch", document.getElementById("branch").value);
    params.append("date", document.getElementById("date").value);
    params.append("type", document.getElementById("type").value);
    params.append("video", base64);

    try {
      statusEl.innerText = "⏳ กำลังอัปโหลดไปยัง Drive...";
      const res = await fetch(API_URL, {
        method: "POST",
        body: params.toString(),
        headers: { "Content-Type": "application/x-www-form-urlencoded" }
      });
      const result = await res.json();
      if (result.status === "success") {
        statusEl.innerText = "✅ บันทึกสำเร็จ";
        statusEl.classList.add('text-emerald-400');
        alert("อัปโหลดเรียบร้อยครับ!");
      } else {
        throw new Error(result.message);
      }
    } catch (e) {
      console.error(e);
      statusEl.innerText = "❌ อัปโหลดไม่สำเร็จ";
      alert("เกิดข้อผิดพลาดในการส่งข้อมูล: " + e.message);
    } finally {
      resetUI();
    }
  };
}

function resetUI() {
  uploadOverlay.style.display = 'none';
  startBtn.disabled = false; startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
}
</script>
